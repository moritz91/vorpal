# CLI release: build the `vorpal` binary for every supported platform and attach each one to
# the GitHub Release DIRECTLY — one raw binary per platform, named `vorpal-<os>-<arch>` (Windows:
# `vorpal-windows-<arch>.exe`), no archive to unpack. cargo-binstall's per-target overrides in
# crates/cli/Cargo.toml expect exactly these names. GitHub-only moritz91 fork releases.
#
# Triggers: pushing `v<upstream-version>+moritz.<build>` does the full release.
# workflow_dispatch builds and tests only; it never publishes.
#
# GITHUB_TOKEN is provided automatically. VORPAL_AGENT_SIGNING_KEY is optional.
#
# Platform coverage: aarch64/arm64 + x86_64/amd64 across macOS, Linux glibc (Debian, Fedora,
# Ubuntu, Arch, …), Linux musl (Alpine), and Windows.
name: Release fork CLI

on:
  push:
    tags: ['v*\+moritz.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Musl lanes build inside official rust:alpine containers, NATIVE per arch (x86_64 on
  # ubuntu-latest, aarch64 on ubuntu-24.04-arm) — the same proven pattern as
  # publish-node.yml's build-musl. Alpine IS musl: apk's build-base ships a native musl
  # gcc AND g++ (tree-sitter-vue's C++ scanner needs the latter; Debian's musl-tools has
  # no C++ compiler, and musl.cc is unreachable from GitHub runners — both tried, both
  # dead ends). Static libstdc++/libgcc come from the same apk toolchain, and each build
  # proves the result with an `ldd` staticness gate.

jobs:
  guard:
    name: Version guard
    if: github.repository == 'moritz91/vorpal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check synchronized fork release metadata
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/fork_release.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/fork_release.py
          fi

  test:
    name: Test gate
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0  # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  windows-regressions:
    name: Windows regression gate
    needs: guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - shell: pwsh
        run: |
          cargo test --locked -p vorpal-index --no-default-features --test cpp_member_calls --test path_prefix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-mcp --test protocol prefix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-outline --test c_family_outline_rules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build:
    name: Build ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, asset: vorpal-macos-arm64 }
          - { target: x86_64-apple-darwin, os: macos-latest, asset: vorpal-macos-x64 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, asset: vorpal-linux-x64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, asset: vorpal-linux-arm64 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true, asset: vorpal-linux-x64-musl }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true, asset: vorpal-linux-arm64-musl }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, asset: vorpal-windows-x64.exe }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, asset: vorpal-windows-arm64.exe }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0  # keep in sync with rust-toolchain.toml
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        if: ${{ !matrix.musl }}
        run: cargo build --locked --release -p vorpal --no-default-features --target ${{ matrix.target }}
      - name: Build (alpine container, native musl)
        if: matrix.musl
        run: |
          # The LINKER env overrides .cargo/config.toml's triple-prefixed musl linker
          # (aarch64-linux-musl-gcc), which does not exist in alpine — its native cc IS
          # the musl toolchain. Same override publish-node.yml's musl builds use.
          docker run --rm -v "$PWD:/w" -w /w \
            -e CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=cc \
            -e CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=cc \
            rust:1.98-alpine sh -c '
            set -e
            apk add --no-cache build-base
            export RUSTFLAGS="-C target-feature=+crt-static"
            cargo build --locked --release -p vorpal --target ${{ matrix.target }}
          '
          # The container wrote target/ as root; later steps (stage, cache) run as the
          # runner user.
          sudo chown -R "$(id -u):$(id -g)" target
          # The point of the musl asset is portability: refuse to ship anything dynamic.
          # Two static shapes exist: classic static ("not a dynamic executable") and
          # static-PIE ("statically linked") — rustc builds x86_64-musl as static-PIE
          # since 1.85 while aarch64-musl stays classic. Anything else is a defect.
          out=$(ldd "target/${{ matrix.target }}/release/vorpal" 2>&1 || true)
          echo "ldd: $out"
          case "$out" in
            *"not a dynamic executable"*|*"statically linked"*) ;;
            *) echo "musl binary is not fully static" >&2; exit 1 ;;
          esac
      - name: Stage binary (unix)
        if: runner.os != 'Windows'
        run: cp "target/${{ matrix.target }}/release/vorpal" "${{ matrix.asset }}"
      - name: Stage binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "target/${{ matrix.target }}/release/vorpal.exe" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # The remote-fleet stage-0 loader + the signed agent (docs/REMOTE.md §2, §6). The agent is the
  # musl `vorpal` binary run as `__agent`; the loader verifies its Ed25519 signature over the
  # blake3 hash and execs it from a memfd (zero on-disk residue). When the repo has a signing key,
  # the loader embeds the matching public key and a pre-signed `.vld` stream is shipped; otherwise
  # the loader is built to accept `--pubkey` at runtime and only the blake3 pin is recorded.
  agent-bundle:
    name: Agent bundle ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    env:
      SIGNING_KEY: ${{ secrets.VORPAL_AGENT_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0  # keep in sync with rust-toolchain.toml
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: agent-${{ matrix.target }}
      - name: Derive the loader's embedded public key (only when a signing key is configured)
        id: pubkey
        run: |
          if [ -n "${SIGNING_KEY}" ]; then
            pub=$(cargo run --locked -q -p vorpal-loader --features keygen --bin vorpal-sign -- pubkey --key-hex "${SIGNING_KEY}")
            echo "hex=${pub}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the loader + agent (alpine container, native musl; pubkey embedded when available)
        env:
          VORPAL_LOADER_PUBKEY_HEX: ${{ steps.pubkey.outputs.hex }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            -e VORPAL_LOADER_PUBKEY_HEX="${VORPAL_LOADER_PUBKEY_HEX}" \
            -e CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=cc \
            -e CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=cc \
            rust:1.98-alpine sh -c '
              set -e
              apk add --no-cache build-base
              export RUSTFLAGS="-C target-feature=+crt-static"
              cargo build --locked --release -p vorpal-loader --bin vorpal-loader --target ${{ matrix.target }}
              cargo build --locked --release -p vorpal --bin vorpal --target ${{ matrix.target }}
            '
          # The container wrote target/ as root; the signing step runs host cargo next.
          sudo chown -R "$(id -u):$(id -g)" target
          # Fleet agents exec on arbitrary distros from a memfd: anything dynamic is a
          # defect. Classic static and static-PIE both pass (rustc: x86_64-musl is
          # static-PIE since 1.85, aarch64-musl classic).
          for bin in vorpal-loader vorpal; do
            out=$(ldd "target/${{ matrix.target }}/release/${bin}" 2>&1 || true)
            echo "ldd ${bin}: $out"
            case "$out" in
              *"not a dynamic executable"*|*"statically linked"*) ;;
              *) echo "${bin} is not fully static" >&2; exit 1 ;;
            esac
          done
      - name: Sign the agent (if keyed) and record its blake3 pin
        run: |
          set -euo pipefail
          agent="target/${{ matrix.target }}/release/vorpal"
          if [ -n "${SIGNING_KEY}" ]; then
            cargo run --locked -q -p vorpal-loader --features keygen --bin vorpal-sign -- sign \
              --key-hex "${SIGNING_KEY}" --agent "$agent" \
              --out "agent-${{ matrix.target }}.vld" \
              --manifest "agent-${{ matrix.target }}.json"
          else
            hash=$(cargo run --locked -q -p vorpal-loader --features keygen --bin vorpal-sign -- hash --agent "$agent")
            printf '{\n  "target": "%s",\n  "blake3": "%s",\n  "signed": false\n}\n' \
              "${{ matrix.target }}" "$hash" > "agent-${{ matrix.target }}.json"
          fi
          cp "target/${{ matrix.target }}/release/vorpal-loader" "vorpal-loader-${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: agent-bundle-${{ matrix.target }}
          path: |
            vorpal-loader-${{ matrix.target }}
            agent-${{ matrix.target }}.json
            agent-${{ matrix.target }}.vld
          if-no-files-found: warn

  release:
    name: GitHub Release
    if: github.repository == 'moritz91/vorpal' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [guard, build, agent-bundle, test, windows-regressions]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Stage assets and SHA-256 checksums
        run: |
          mkdir release-assets
          find artifacts -type f \( -name 'vorpal-*' -o -name 'agent-*.json' -o -name 'agent-*.vld' \) -exec cp -t release-assets {} +
          cd release-assets
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          # Flattened CLI and agent assets plus SHA256SUMS; optional signatures are
          # included only when a signing key exists.
          files: release-assets/*
          generate_release_notes: true
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
