name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs also exercise the weights-gated encoder parity on x86 (below).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Native output projection controls
        run: python3 -m unittest discover -s scripts/tests -p 'test_cpp_macro_*.py'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0  # keep in sync with rust-toolchain.toml
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # No `cargo fmt --check` gate, deliberately: the tree predates rustfmt conformance
      # (inherited ast-grep code plus repo idiom), and a whole-repo reformat would poison
      # blame and permanently diverge every inherited file from upstream. The gate failed
      # every push since the workflow landed, which also meant Clippy and Test NEVER ran —
      # a red-forever check is worse than no check. Clippy at -D warnings is the lint gate.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # vorpal-py's bindings are behind the off-by-default `python` feature, so the
      # workspace pass never compiles them — lint them the way the wheel build does.
      - name: Clippy (python bindings)
        run: cargo clippy -p vorpal-py --features python --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  windows-paths-and-parser:
    name: Windows paths and C++ parser
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Native output projection controls
        run: python -m unittest discover -s scripts/tests -p 'test_cpp_macro_*.py'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - shell: pwsh
        run: |
          cargo test --locked -p vorpal-index --no-default-features --test cpp_textual_include_live --test cpp_member_calls --test path_suffix --test resolution_eval --test cpp_macro_replay --test cpp_macro_compiler --test cpp_textual_include_context --test parse_health_paths --test markdown_replay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-mcp --lib --test protocol
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-index --no-default-features --lib scope::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-index --no-default-features --lib native_structured_base
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-ingest --lib native_operators
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-outline --lib bundled_rule_bytes_use_canonical_line_endings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-ingest --lib work_priority_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-ingest --test streamed --test stream_priority
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-ingest --test cpp_macro_parsing --test cpp_directive_audit --test cpp_include_context --test cpp_include_projection --test cpp_macro_evidence --test cpp_macro_recovery --test cpp_macro_compiler_audit --test cpp_macro_compiler_production --test cpp_macro_freshness --test powershell_parsing --test markdown_parsing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-mcp --test cpp_macro_freshness --test cpp_macro_compiler --test cpp_textual_include_context
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-language --test grammar_provenance --test cpp_statement_macro_sites --test markdown_control_characters
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal --test cpp_macro_config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-ingest --lib product::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-kg --test source_contexts --test canonical_seal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-resolve --test textual_context
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-outline --test c_family_outline_rules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  native-dependency-audit:
    name: MSVC native dependency audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: microsoft/Detours
          ref: e4bfd6b03e50de46b47abfbd1e46b384f0c5f833 # v4.0.1, MIT
          path: .native-audit-detours
      - name: Build isolated native probe and run real MSVC controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsRoot = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$vsRoot/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation | Out-Null
          Push-Location .native-audit-detours/src
          nmake /nologo
          $detoursExit = $LASTEXITCODE
          Pop-Location
          if ($detoursExit -ne 0) { exit $detoursExit }
          $build = "$env:RUNNER_TEMP/native-dependency-build"
          cmake -S scripts/native_dependency_audit -B $build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DDETOURS_ROOT=$pwd/.native-audit-detours"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/cpp_native_dependency_control.py --launcher "$build/vorpal_native_audit.exe" --dll "$build/vorpal_native_probe64.dll" --directory "$env:RUNNER_TEMP/native-dependency-controls"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/cpp_native_process_control.py --launcher "$build/vorpal_native_audit.exe" --debugger "$build/vorpal_native_process_audit.exe" --dll "$build/vorpal_native_probe64.dll" --fixture "$build/vorpal_native_process_control.exe" --directory "$env:RUNNER_TEMP/native-process-controls" --plan "$env:RUNNER_TEMP/native-dependency-controls/plan.json" --source "$env:RUNNER_TEMP/native-dependency-controls/src/probe.cc"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/cpp_native_input_control.py --launcher "$build/vorpal_native_audit.exe" --debugger "$build/vorpal_native_process_audit.exe" --dll "$build/vorpal_native_probe64.dll" --fixture "$build/vorpal_native_process_control.exe" --input-fixture "$build/vorpal_native_input_control.exe" --directory "$env:RUNNER_TEMP/native-input-controls" --plan "$env:RUNNER_TEMP/native-dependency-controls/plan.json" --source "$env:RUNNER_TEMP/native-dependency-controls/src/probe.cc"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/cpp_native_stability_control.py --launcher "$build/vorpal_native_audit.exe" --actor "$build/vorpal_native_stability_actor.exe" --directory "$env:RUNNER_TEMP/native-stability-controls"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/cpp_native_capture_control.py --launcher "$build/vorpal_native_audit.exe" --actor "$build/vorpal_native_stability_actor.exe" --directory "$env:RUNNER_TEMP/native-capture-controls"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve report-only control summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-dependency-audit-controls
          path: |
            ${{ runner.temp }}/native-dependency-controls/controls.json
            ${{ runner.temp }}/native-process-controls/controls.json
            ${{ runner.temp }}/native-input-controls/controls.json
            ${{ runner.temp }}/native-stability-controls/controls.json
            ${{ runner.temp }}/native-capture-controls/controls.json
          if-no-files-found: ignore

  # The encoder's x86 GEMM rungs (crates/ann/src/encoder/{gemm_x86,gemm_i8}.rs) can
  # only be MEASURED on x86 hardware: the development machine is Apple silicon, where
  # Rosetta/QEMU emulation proves AVX2 correctness but no rate, and AVX-512 / VNNI are
  # not reachable at all. This job is the x86 datum: it prints the runner's ISA, runs
  # every present kernel against the exact reference / the fixed lanes (weights-free
  # unit oracles), and records the GEMM rate at the recorded 256-surface batch —
  # docs/wip/BENCHMARKS.md ("Cross-platform encoder") cites its log.
  encoder-x86:
    name: encoder x86 kernels (parity + GEMM rate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0  # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: Runner ISA
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)' || true
          grep -o -w 'avx2\|fma\|avx512f\|avx512bw\|avx512_vnni\|avx_vnni' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
      - name: Kernel oracles (every present ISA vs the exact reference and the fixed lanes)
        run: cargo test --release -p vorpal-ann --lib encoder -- --nocapture
      - name: GEMM rate at the 256-surface batch (4690 tokens, median of 3)
        run: cargo run --release -p vorpal-ann --example gemm_bench -- 4690 3
      # Weights-gated parity on the real encoder (547 MB download): manual runs only.
      - name: Install the pinned encoder weights (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cargo build --release -p vorpal
          VORPAL_HOME="$RUNNER_TEMP/vhome" target/release/vorpal enable semantic-f32
      - name: Real-encoder parity (throughput / int8 vs the fixed lanes; workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          VORPAL_CODERANK_DIR: ${{ runner.temp }}/vhome/models/coderankembed-f32
        run: cargo test --release -p vorpal-ann --test encoder -- --nocapture --test-threads 1 throughput_path int8_path
