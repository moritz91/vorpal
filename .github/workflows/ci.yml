name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs also exercise the weights-gated encoder parity on x86 (below).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0  # keep in sync with rust-toolchain.toml
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # No `cargo fmt --check` gate, deliberately: the tree predates rustfmt conformance
      # (inherited ast-grep code plus repo idiom), and a whole-repo reformat would poison
      # blame and permanently diverge every inherited file from upstream. The gate failed
      # every push since the workflow landed, which also meant Clippy and Test NEVER ran —
      # a red-forever check is worse than no check. Clippy at -D warnings is the lint gate.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # vorpal-py's bindings are behind the off-by-default `python` feature, so the
      # workspace pass never compiles them — lint them the way the wheel build does.
      - name: Clippy (python bindings)
        run: cargo clippy -p vorpal-py --features python --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  windows-paths-and-parser:
    name: Windows paths and C++ parser
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - shell: pwsh
        run: |
          cargo test --locked -p vorpal-index --no-default-features --test cpp_member_calls --test path_suffix --test resolution_eval --test cpp_macro_replay --test parse_health_paths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-mcp --lib --test protocol
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-index --no-default-features --lib scope::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-index --no-default-features --lib native_structured_base
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-ingest --test cpp_macro_parsing --test cpp_directive_audit --test cpp_macro_evidence --test cpp_macro_recovery --test cpp_macro_compiler_audit --test cpp_macro_freshness --test powershell_parsing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-mcp --test cpp_macro_freshness
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-language --test grammar_provenance --test cpp_statement_macro_sites
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal --test cpp_macro_config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p vorpal-outline --test c_family_outline_rules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The encoder's x86 GEMM rungs (crates/ann/src/encoder/{gemm_x86,gemm_i8}.rs) can
  # only be MEASURED on x86 hardware: the development machine is Apple silicon, where
  # Rosetta/QEMU emulation proves AVX2 correctness but no rate, and AVX-512 / VNNI are
  # not reachable at all. This job is the x86 datum: it prints the runner's ISA, runs
  # every present kernel against the exact reference / the fixed lanes (weights-free
  # unit oracles), and records the GEMM rate at the recorded 256-surface batch —
  # docs/wip/BENCHMARKS.md ("Cross-platform encoder") cites its log.
  encoder-x86:
    name: encoder x86 kernels (parity + GEMM rate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0  # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: Runner ISA
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)' || true
          grep -o -w 'avx2\|fma\|avx512f\|avx512bw\|avx512_vnni\|avx_vnni' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
      - name: Kernel oracles (every present ISA vs the exact reference and the fixed lanes)
        run: cargo test --release -p vorpal-ann --lib encoder -- --nocapture
      - name: GEMM rate at the 256-surface batch (4690 tokens, median of 3)
        run: cargo run --release -p vorpal-ann --example gemm_bench -- 4690 3
      # Weights-gated parity on the real encoder (547 MB download): manual runs only.
      - name: Install the pinned encoder weights (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cargo build --release -p vorpal
          VORPAL_HOME="$RUNNER_TEMP/vhome" target/release/vorpal enable semantic-f32
      - name: Real-encoder parity (throughput / int8 vs the fixed lanes; workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          VORPAL_CODERANK_DIR: ${{ runner.temp }}/vhome/models/coderankembed-f32
        run: cargo test --release -p vorpal-ann --test encoder -- --nocapture --test-threads 1 throughput_path int8_path
